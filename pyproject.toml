[project]
name = "LUCID"
version = "0.1.0"
description = "Local web dashboard for multi-window Claude Code orchestration"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "paramiko>=3.5",
    "tomli>=2.0; python_version < '3.11'",
    "uvicorn>=0.32",
    "watchfiles>=0.24",
    "websockets>=10.4",
    "sse-starlette>=2.1",
]

[project.scripts]
lucid = "core.terminal.runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["core*"]
